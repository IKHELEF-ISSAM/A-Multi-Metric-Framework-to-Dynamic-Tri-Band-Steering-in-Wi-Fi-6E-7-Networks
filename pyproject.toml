[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-metric-wifi-steering"
version = "0.1.0"
description = "OpenWrt direct-SSH multi-metric Wi-Fi client steering research prototype"
requires-python = ">=3.10"
dependencies = ["Flask==3.1.3", "flask-cors==6.0.5"]

[project.scripts]
wifi-steering = "wifi_steering.cli:main"

[tool.setuptools.packages.find]
include = ["wifi_steering*"]
